<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="횟수 카운터">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>횟수 카운터</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <!-- 설정 화면 -->
    <section id="setup" class="screen" aria-labelledby="setup-title">
      <h1 id="setup-title" class="title">횟수 카운터</h1>
      <form id="setup-form" class="setup-form" novalidate>
        <label class="field">
          <span class="field-label">목표 횟수</span>
          <span class="stepper">
            <button type="button" class="stepper-btn" data-target="goal" data-delta="-10" aria-label="목표 10 줄이기">−</button>
            <input id="goal" name="goal" type="number" inputmode="numeric" min="1" max="9999" value="50">
            <button type="button" class="stepper-btn" data-target="goal" data-delta="10" aria-label="목표 10 늘리기">+</button>
          </span>
        </label>
        <label class="field">
          <span class="field-label">카드당 횟수</span>
          <span class="stepper">
            <button type="button" class="stepper-btn" data-target="step" data-delta="-1" aria-label="카드당 횟수 1 줄이기">−</button>
            <input id="step" name="step" type="number" inputmode="numeric" min="1" max="9999" value="10">
            <button type="button" class="stepper-btn" data-target="step" data-delta="1" aria-label="카드당 횟수 1 늘리기">+</button>
          </span>
        </label>
        <p id="setup-preview" class="preview" aria-live="polite"></p>
        <button type="submit" class="primary">시작</button>
      </form>
    </section>

    <!-- 세는 화면 -->
    <section id="counter" class="screen" hidden aria-label="횟수 세기">
      <header class="counter-head">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle id="ring-bar" class="ring-bar" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-text">
            <span id="done" class="done">0</span>
            <span class="goal-line">/ <span id="goal-text">50</span></span>
          </div>
        </div>
        <ol id="dots" class="dots" aria-hidden="true"></ol>
        <p id="sets-text" class="sets-text" aria-live="polite"></p>
      </header>

      <div class="stage">
        <button id="card" class="card" type="button">
          <span class="card-label">이번 세트</span>
          <span id="card-num" class="card-num">10</span>
          <span class="card-hint">끝나면 누르기</span>
        </button>
        <div id="finish" class="finish" hidden>
          <span class="finish-mark" aria-hidden="true">✓</span>
          <span class="finish-title">완료</span>
          <span id="finish-sub" class="finish-sub"></span>
        </div>
        <div id="floats" class="floats" aria-hidden="true"></div>
      </div>

      <footer class="actions">
        <button id="undo" class="ghost" type="button">되돌리기</button>
        <button id="reset" class="ghost" type="button">새로 시작</button>
      </footer>
    </section>
  </main>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
